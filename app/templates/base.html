<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>{% block title %}PARA Organizer{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Inter", "Noto Sans Thai", "ui-sans-serif", "system-ui", "sans-serif"],
                    },
                },
            },
        };
    </script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/json-enc.js"></script>
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/app.js" defer></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-50 font-sans text-slate-900 antialiased">
    <nav class="border-b border-slate-800 bg-slate-900 text-white">
        <div class="mx-auto flex max-w-screen-2xl flex-wrap items-center gap-3 px-4 py-3 sm:px-6 lg:px-8">
            <a href="/" class="mr-auto flex items-center gap-2 text-sm font-semibold tracking-tight">
                <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-emerald-500 text-slate-950">P</span>
                <span>PARA Organizer</span>
            </a>

            <button type="button" data-nav-toggle aria-expanded="false" aria-controls="mobile-navigation"
                    class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-slate-700 text-slate-300 transition hover:bg-slate-800 hover:text-white md:hidden">
                <span class="sr-only">Toggle navigation</span>
                <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M4 7h16M4 12h16M4 17h16"/>
                </svg>
            </button>

            <div id="mobile-navigation" data-nav-menu class="hidden w-full items-center gap-2 md:flex md:w-auto">
                <form action="/search" method="get" class="relative mb-2 w-full md:mb-0 md:mr-2 md:w-64">
                    <svg viewBox="0 0 24 24" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-500"
                         fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
                    </svg>
                    <input type="search" name="q" placeholder="Search notes..." value="{{ query|default('') }}"
                           class="h-9 w-full rounded-lg border border-slate-700 bg-slate-800 pl-9 pr-3 text-sm text-white placeholder:text-slate-500 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20">
                </form>
                <div class="flex flex-col gap-1 md:flex-row md:items-center">
                    <a href="/" class="rounded-md px-3 py-2 text-sm text-slate-300 transition hover:bg-slate-800 hover:text-white">Board</a>
                    <a href="/stats" class="rounded-md px-3 py-2 text-sm text-slate-300 transition hover:bg-slate-800 hover:text-white">Stats</a>
                    <a href="/settings" class="rounded-md px-3 py-2 text-sm text-slate-300 transition hover:bg-slate-800 hover:text-white">Settings</a>
                    <a href="/new" class="mt-1 inline-flex h-9 items-center justify-center rounded-lg bg-emerald-500 px-3 text-sm font-medium text-slate-950 transition hover:bg-emerald-400 md:ml-1 md:mt-0">+ New Note</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="mx-auto w-full max-w-screen-2xl flex-1 px-4 py-8 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-slate-200 bg-white">
        <div class="mx-auto flex max-w-screen-2xl items-center justify-between px-4 py-5 text-xs text-slate-500 sm:px-6 lg:px-8">
            <span>PARA Organizer</span>
            <span>Version 1.0.0</span>
        </div>
    </footer>
</body>
</html>
