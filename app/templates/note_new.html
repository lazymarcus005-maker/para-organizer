{% extends "base.html" %}
{% block title %}New Note · PARA Organizer{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl">
    <a href="/" class="mb-5 inline-flex items-center gap-1 text-sm text-slate-500 transition hover:text-slate-900">
        <span aria-hidden="true">←</span> Back to board
    </a>
    <section class="rounded-lg border border-slate-200 bg-white shadow-sm">
        <header class="border-b border-slate-200 p-6">
            <h1 class="text-2xl font-semibold tracking-tight">Create a new note</h1>
            <p class="mt-1 text-sm text-slate-500">Capture an idea now. PARA Organizer will classify it for you.</p>
        </header>
        <form method="post" action="/new" class="space-y-6 p-6">
            <div>
                <label for="title" class="mb-2 block text-sm font-medium">Title</label>
                <input id="title" type="text" name="title" required autofocus placeholder="What would you like to remember?"
                       class="h-10 w-full rounded-lg border border-slate-200 bg-white px-3 text-sm shadow-sm placeholder:text-slate-400 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20">
            </div>
            <div>
                <div class="mb-2 flex items-center justify-between">
                    <label for="content" class="block text-sm font-medium">Content</label>
                    <span class="text-xs text-slate-400">Plain text</span>
                </div>
                <textarea id="content" name="content" rows="10" required placeholder="Add details, context, or next steps..."
                          class="w-full resize-y rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm leading-6 shadow-sm placeholder:text-slate-400 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20"></textarea>
            </div>
            <div class="flex flex-col-reverse gap-3 border-t border-slate-200 pt-6 sm:flex-row sm:justify-end">
                <a href="/" class="inline-flex h-10 items-center justify-center rounded-lg border border-slate-200 bg-white px-4 text-sm font-medium shadow-sm transition hover:bg-slate-50">Cancel</a>
                <button type="submit" class="inline-flex h-10 items-center justify-center rounded-lg bg-emerald-600 px-4 text-sm font-medium text-white shadow-sm transition hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2">
                    Save &amp; Auto-classify
                </button>
            </div>
        </form>
    </section>
</div>
{% endblock %}
