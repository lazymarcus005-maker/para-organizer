{% extends "base.html" %}
{% block title %}Kanban Board · PARA Organizer{% endblock %}
{% block content %}
<div class="mx-auto max-w-7xl">
    <div class="mb-6">
        <p class="mb-1 text-sm font-medium text-emerald-600">Manage</p>
        <h1 class="text-2xl font-semibold tracking-tight sm:text-3xl">Project Board</h1>
        <p class="mt-1 text-sm text-slate-500">Drag projects across columns to update status.</p>
    </div>

    <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
        <!-- Active Column -->
        <section class="flex min-h-[40rem] flex-col rounded-lg border border-slate-200 bg-white shadow-sm"
                 data-status="active">
            <header class="border-b border-slate-200 bg-gradient-to-r from-emerald-50 to-emerald-50/50 px-4 py-3">
                <div>
                    <h2 class="text-sm font-semibold text-slate-900">Active Projects</h2>
                    <p class="mt-0.5 text-xs text-slate-500">In progress</p>
                </div>
            </header>
            <div class="flex flex-1 flex-col gap-3 overflow-y-auto p-3" data-status-column="active" data-drop-zone>
                <!-- Cards will be populated by app.js -->
            </div>
        </section>

        <!-- Completed Column -->
        <section class="flex min-h-[40rem] flex-col rounded-lg border border-slate-200 bg-white shadow-sm"
                 data-status="completed">
            <header class="border-b border-slate-200 bg-gradient-to-r from-blue-50 to-blue-50/50 px-4 py-3">
                <div>
                    <h2 class="text-sm font-semibold text-slate-900">Completed</h2>
                    <p class="mt-0.5 text-xs text-slate-500">Done</p>
                </div>
            </header>
            <div class="flex flex-1 flex-col gap-3 overflow-y-auto p-3" data-status-column="completed" data-drop-zone>
                <!-- Cards will be populated by app.js -->
            </div>
        </section>

        <!-- Archived Column -->
        <section class="flex min-h-[40rem] flex-col rounded-lg border border-slate-200 bg-white shadow-sm"
                 data-status="archived">
            <header class="border-b border-slate-200 bg-gradient-to-r from-slate-100 to-slate-50 px-4 py-3">
                <div>
                    <h2 class="text-sm font-semibold text-slate-900">Archived</h2>
                    <p class="mt-0.5 text-xs text-slate-500">Inactive</p>
                </div>
            </header>
            <div class="flex flex-1 flex-col gap-3 overflow-y-auto p-3" data-status-column="archived" data-drop-zone>
                <!-- Cards will be populated by app.js -->
            </div>
        </section>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
<script src="/static/board.js" defer></script>
{% endblock %}
