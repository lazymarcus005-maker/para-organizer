<article id="note-card-{{ note.id }}" draggable="true" ondragstart="dragNote(event)" ondragend="endDrag(event)"
         data-id="{{ note.id }}"
         class="group rounded-lg border border-slate-200 bg-white p-4 shadow-sm transition duration-200 hover:-translate-y-0.5 hover:border-slate-300 hover:shadow-md">
    <a href="/notes/{{ note.id }}" class="block">
        <div class="flex items-start gap-2.5">
            <span class="mt-1.5 h-2 w-2 shrink-0 rounded-full
                {% if note.priority == 'urgent' or note.priority == 'high' %}bg-red-500
                {% elif note.priority == 'medium' %}bg-amber-500
                {% else %}bg-emerald-500{% endif %}"
                title="{{ note.priority|capitalize }} priority"></span>
            <h3 class="min-w-0 flex-1 text-sm font-medium leading-5 text-slate-900 group-hover:text-emerald-700">{{ note.title }}</h3>
        </div>
        {% if note.review_needed %}
        <div class="mt-2">
            <span class="inline-flex items-center rounded-md border border-orange-200 bg-orange-50 px-2 py-1 text-xs font-medium text-orange-700"
                  title="Low classification confidence — needs manual review">
                ⚠️ needs review
            </span>
        </div>
        {% endif %}
        {% if note.deadline %}
        <div class="mt-3">
            <span class="inline-flex items-center rounded-md border border-amber-200 bg-amber-50 px-2 py-1 text-xs font-medium text-amber-700">
                Due {{ note.deadline }}
            </span>
        </div>
        {% endif %}
        {% if note.tags %}
        <div class="mt-3 flex flex-wrap gap-1.5 border-t border-slate-100 pt-3">
            {% for tag in note.tags %}
            <span class="rounded-md bg-slate-100 px-2 py-1 text-xs text-slate-600">{{ tag }}</span>
            {% endfor %}
        </div>
        {% endif %}
    </a>
</article>
