x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &app-healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:8731/api/health/live"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

services:
  # ── Redis ─────────────────────────────────────────────────────────────────
  para-redis:
    image: redis:7-alpine
    container_name: para-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
    networks:
      - para-overlay
    logging: *default-logging

  # ── FastAPI App ───────────────────────────────────────────────────────────
  para-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      sh -c "
        ./scripts/wait-for-it.sh para-redis 6379 &&
        python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8731
      "
    depends_on:
      para-redis:
        condition: service_healthy
    ports:
      - "8731:8731"
    environment:
      - PARA_PORT=8731
      - PARA_DB_URL=postgresql+asyncpg://paradb:paradb%231234@169.58.65.88:5436/paradb
      - PARA_REDIS_URL=redis://para-redis:6379/0
      - PARA_DB_POOL_SIZE=${PARA_DB_POOL_SIZE:-10}
      - PARA_DB_MAX_OVERFLOW=${PARA_DB_MAX_OVERFLOW:-20}
      - PARA_REDIS_CACHE_TTL=${PARA_REDIS_CACHE_TTL:-60}
      - PARA_SECRET_KEY=${PARA_SECRET_KEY:-change-me-in-production}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://ollama.com/v1}
      - LLM_PRIMARY=${LLM_PRIMARY:-deepseek-v4-flash}
      - LLM_FALLBACK=${LLM_FALLBACK:-gpt-oss:20b}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      - NOTIFY_CHANNEL=${NOTIFY_CHANNEL:-telegram}
      - NOTIFY_DEADLINE_DAYS=${NOTIFY_DEADLINE_DAYS:-7,3,1}
      - NOTIFY_DIGEST_DAY=${NOTIFY_DIGEST_DAY:-mon}
      - NOTIFY_DIGEST_TIME=${NOTIFY_DIGEST_TIME:-08:00}
      - NOTIFY_STALE_DAYS=${NOTIFY_STALE_DAYS:-14}
      - AUTO_ARCHIVE_DAYS=${AUTO_ARCHIVE_DAYS:-30}
      - RECLASSIFY_INTERVAL_HOURS=${RECLASSIFY_INTERVAL_HOURS:-6}
      - RECLASSIFY_CONFIDENCE_THRESHOLD=${RECLASSIFY_CONFIDENCE_THRESHOLD:-0.7}
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL:-https://para.mxlabs.cloud}
      - EMBED_PROVIDER=${EMBED_PROVIDER:-ollama_local}
      - EMBED_BASE_URL=${EMBED_BASE_URL:-http://localhost:11434}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - RAG_HYBRID_ENABLED=${RAG_HYBRID_ENABLED:-true}
      - RAG_HYBRID_RATIO=${RAG_HYBRID_RATIO:-0.5}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8731/api/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
    networks:
      - para-overlay
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.para-app.rule=Host(`para.mxlabs.cloud`)"
      - "traefik.http.routers.para-app.entrypoints=websecure"
      - "traefik.http.routers.para-app.tls=true"
      - "traefik.http.routers.para-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.para-app.loadbalancer.server.port=8731"
      - "traefik.http.routers.para-app.middlewares=para-ratelimit"
      - "traefik.http.middlewares.para-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.para-ratelimit.ratelimit.burst=200"
    logging: *default-logging

  # ── Background Worker ─────────────────────────────────────────────────────
  para-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python3 -m app.worker
    depends_on:
      para-redis:
        condition: service_healthy
    environment:
      - PARA_DB_URL=postgresql+asyncpg://paradb:paradb%231234@169.58.65.88:5436/paradb
      - PARA_REDIS_URL=redis://para-redis:6379/0
      - PARA_DB_POOL_SIZE=${PARA_DB_POOL_SIZE:-10}
      - PARA_DB_MAX_OVERFLOW=${PARA_DB_MAX_OVERFLOW:-20}
      - PARA_REDIS_CACHE_TTL=${PARA_REDIS_CACHE_TTL:-60}
      - PARA_SECRET_KEY=${PARA_SECRET_KEY:-change-me-in-production}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://ollama.com/v1}
      - LLM_PRIMARY=${LLM_PRIMARY:-deepseek-v4-flash}
      - LLM_FALLBACK=${LLM_FALLBACK:-gpt-oss:20b}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - NOTIFY_CHANNEL=${NOTIFY_CHANNEL:-telegram}
      - NOTIFY_DEADLINE_DAYS=${NOTIFY_DEADLINE_DAYS:-7,3,1}
      - NOTIFY_DIGEST_DAY=${NOTIFY_DIGEST_DAY:-mon}
      - NOTIFY_DIGEST_TIME=${NOTIFY_DIGEST_TIME:-08:00}
      - NOTIFY_STALE_DAYS=${NOTIFY_STALE_DAYS:-14}
      - AUTO_ARCHIVE_DAYS=${AUTO_ARCHIVE_DAYS:-30}
      - RECLASSIFY_INTERVAL_HOURS=${RECLASSIFY_INTERVAL_HOURS:-6}
      - RECLASSIFY_CONFIDENCE_THRESHOLD=${RECLASSIFY_CONFIDENCE_THRESHOLD:-0.7}
      - EMBED_PROVIDER=${EMBED_PROVIDER:-ollama_local}
      - EMBED_BASE_URL=${EMBED_BASE_URL:-http://localhost:11434}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - RAG_HYBRID_ENABLED=${RAG_HYBRID_ENABLED:-true}
      - RAG_HYBRID_RATIO=${RAG_HYBRID_RATIO:-0.5}
    healthcheck:
      disable: true
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
    networks:
      - para-overlay
      - dokploy-network
    logging: *default-logging

  # ── Scheduler (Singleton) ────────────────────────────────────────────────
  para-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: para-scheduler
    restart: unless-stopped
    command: python3 -m app.scheduler_service
    depends_on:
      para-redis:
        condition: service_healthy
    environment:
      - PARA_DB_URL=postgresql+asyncpg://paradb:paradb%231234@169.58.65.88:5436/paradb
      - PARA_REDIS_URL=redis://para-redis:6379/0
      - PARA_DB_POOL_SIZE=${PARA_DB_POOL_SIZE:-10}
      - PARA_DB_MAX_OVERFLOW=${PARA_DB_MAX_OVERFLOW:-20}
      - PARA_REDIS_CACHE_TTL=${PARA_REDIS_CACHE_TTL:-60}
      - PARA_SECRET_KEY=${PARA_SECRET_KEY:-change-me-in-production}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://ollama.com/v1}
      - LLM_PRIMARY=${LLM_PRIMARY:-deepseek-v4-flash}
      - LLM_FALLBACK=${LLM_FALLBACK:-gpt-oss:20b}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - NOTIFY_CHANNEL=${NOTIFY_CHANNEL:-telegram}
      - NOTIFY_DEADLINE_DAYS=${NOTIFY_DEADLINE_DAYS:-7,3,1}
      - NOTIFY_DIGEST_DAY=${NOTIFY_DIGEST_DAY:-mon}
      - NOTIFY_DIGEST_TIME=${NOTIFY_DIGEST_TIME:-08:00}
      - NOTIFY_STALE_DAYS=${NOTIFY_STALE_DAYS:-14}
      - AUTO_ARCHIVE_DAYS=${AUTO_ARCHIVE_DAYS:-30}
      - RECLASSIFY_INTERVAL_HOURS=${RECLASSIFY_INTERVAL_HOURS:-6}
      - RECLASSIFY_CONFIDENCE_THRESHOLD=${RECLASSIFY_CONFIDENCE_THRESHOLD:-0.7}
      - EMBED_PROVIDER=${EMBED_PROVIDER:-ollama_local}
      - EMBED_BASE_URL=${EMBED_BASE_URL:-http://localhost:11434}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - RAG_HYBRID_ENABLED=${RAG_HYBRID_ENABLED:-true}
      - RAG_HYBRID_RATIO=${RAG_HYBRID_RATIO:-0.5}
    healthcheck:
      disable: true
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
    networks:
      - para-overlay
      - dokploy-network
    logging: *default-logging

  # ── MCP HTTP SSE Server ──────────────────────────────────────────────────
  para-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python3 -m app.mcp.mcp_server_http
    environment:
      - PARA_DB_URL=postgresql+asyncpg://paradb:paradb%231234@169.58.65.88:5436/paradb
      - PARA_DB_POOL_SIZE=${PARA_DB_POOL_SIZE:-10}
      - PARA_DB_MAX_OVERFLOW=${PARA_DB_MAX_OVERFLOW:-20}
      - PARA_SECRET_KEY=${PARA_SECRET_KEY:-change-me-in-production}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://ollama.com/v1}
      - LLM_PRIMARY=${LLM_PRIMARY:-deepseek-v4-flash}
      - LLM_FALLBACK=${LLM_FALLBACK:-gpt-oss:20b}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - EMBED_PROVIDER=${EMBED_PROVIDER:-ollama_local}
      - EMBED_BASE_URL=${EMBED_BASE_URL:-http://localhost:11434}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - RAG_HYBRID_ENABLED=${RAG_HYBRID_ENABLED:-true}
      - RAG_HYBRID_RATIO=${RAG_HYBRID_RATIO:-0.5}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
    networks:
      - para-overlay
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.para-mcp.rule=Host(`mc-para.mxlabs.cloud`)"
      - "traefik.http.routers.para-mcp.entrypoints=websecure"
      - "traefik.http.routers.para-mcp.tls=true"
      - "traefik.http.routers.para-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.para-mcp.loadbalancer.server.port=8100"
    logging: *default-logging

  # ── Backup (Optional) ──────────────────────────────────────────────────────
  para-backup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: para-backup
    restart: unless-stopped
    command: python3 -m app.scheduler_service --backup-only
    environment:
      - PARA_DB_URL=postgresql+asyncpg://paradb:paradb%231234@169.58.65.88:5436/paradb
      - PARA_REDIS_URL=redis://para-redis:6379/0
      - PARA_SECRET_KEY=${PARA_SECRET_KEY:-change-me-in-production}
      - BACKUP_CLOUD_ENABLED=${BACKUP_CLOUD_ENABLED:-false}
      - BACKUP_CLOUD_ENDPOINT=${BACKUP_CLOUD_ENDPOINT}
      - BACKUP_CLOUD_BUCKET=${BACKUP_CLOUD_BUCKET}
      - BACKUP_CLOUD_ACCESS_KEY=${BACKUP_CLOUD_ACCESS_KEY}
      - BACKUP_CLOUD_SECRET_KEY=${BACKUP_CLOUD_SECRET_KEY}
      - BACKUP_CLOUD_RETENTION_DAYS=${BACKUP_CLOUD_RETENTION_DAYS:-30}
    healthcheck:
      disable: true
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
    networks:
      - para-overlay
      - dokploy-network
    logging: *default-logging

volumes:
  pgdata:
    driver: local
  redis-data:
    driver: local

networks:
  para-overlay:
    driver: overlay
    attachable: true
  dokploy-network:
    external: true
